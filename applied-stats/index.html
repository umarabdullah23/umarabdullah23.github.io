<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Applications Tracker</title>
<style>
:root{
  --bg:#f5f6f8;--panel:#ffffff;--fg:#151a23;--mut:#6b7280;--line:#e5e7eb;--soft:#f0f2f5;
  --acc:#2f6fed;--acc-soft:#e8efff;--warn:#b45309;--warn-soft:#fff4e5;
  --c-boards:#2f6fed;--c-email:#0f9d76;--c-indeed:#8b5cf6;--c-web:#d97706;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1117;--panel:#161b24;--fg:#e7eaf0;--mut:#9aa3b2;--line:#273041;--soft:#1d2430;
  --acc:#6b9bff;--acc-soft:#1b2740;--warn:#f59e0b;--warn-soft:#2d2210;
  --c-boards:#6b9bff;--c-email:#34d3a6;--c-indeed:#a78bfa;--c-web:#fbbf24;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:22px 16px 40px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
.sub{color:var(--mut);font-size:12.5px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--mut);font:inherit;font-size:13px;padding:6px 12px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--acc-soft);color:var(--acc);font-weight:600}
.range{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.range select,.range input{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;padding:5px 8px;font:inherit;font-size:13px}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:8px 0 18px;overflow-x:auto}
nav.tabs button{border:0;background:none;color:var(--mut);font:inherit;font-weight:600;padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button.on{color:var(--fg);border-color:var(--acc)}
nav.tabs .n{display:inline-block;margin-left:6px;font-size:11.5px;background:var(--soft);color:var(--mut);border-radius:999px;padding:1px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;position:relative;overflow:hidden}
.kpi .l{color:var(--mut);font-size:12.5px}
.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.kpi .d{font-size:12px;color:var(--mut)}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--bar,var(--acc))}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px}
.panel h3{margin:0 0 10px;font-size:14px}
.row2{display:grid;grid-template-columns:2fr 1fr;gap:14px}
@media (max-width:860px){.row2{grid-template-columns:1fr}}
.chart{width:100%;height:220px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:13px}
.list .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .bar{flex:0 0 38%;height:6px;background:var(--soft);border-radius:4px;overflow:hidden}
.list .bar span{display:block;height:100%;background:var(--acc)}
.list .ct{width:34px;text-align:right;color:var(--mut);font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 10px}
.tools input,.tools select{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:9px;padding:8px 11px;font:inherit}
.tools input{flex:1;min-width:220px}
.tbl{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:70vh}
table{border-collapse:collapse;width:100%;min-width:780px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}
th{position:sticky;top:0;background:var(--panel);color:var(--mut);font-weight:600;cursor:pointer;user-select:none;white-space:nowrap}
th:hover{color:var(--fg)}
tr:hover td{background:var(--soft)}
tr.dup td:first-child{box-shadow:inset 3px 0 var(--warn)}
.tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--mut);white-space:nowrap}
.tag.dup{background:var(--warn-soft);color:var(--warn)}
.empty{padding:28px;text-align:center;color:var(--mut)}
.foot{color:var(--mut);font-size:12px;margin-top:10px}
code{font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Applications Tracker</h1>
      <div class="sub" id="gen"></div>
    </div>
    <div class="range">
      <div class="seg" id="seg">
        <button data-r="today">Today</button><button data-r="7" class="on">7 days</button><button data-r="30">30 days</button><button data-r="90">90 days</button><button data-r="all">All time</button>
      </div>
      <select id="cat" title="Category"><option value="">All categories</option></select><input type="date" id="from" title="From"><span class="sub">to</span><input type="date" id="to" title="To">
    </div>
  </header>

  <nav class="tabs" id="tabs"></nav>
  <main id="view"></main>
  <div class="foot">Published snapshot, updated every 30 minutes. Orange marks the same company + role applied more than once.</div>
</div>

ineer (DataBricks)","resume":"full-stack","ats":"Lahore","status":"applied","category":"Full Stack","dup":false},{"channel":"Indeed PK","date":"2026-10-23","site":"Indeed","company":"Cyngro","role":"MERN Stack Developer","resume":"full-stack","ats":"Lahore","status":"applied","category":"Full Stack","dup":true},{"channel":"Indeed PK","date":"2026-10-23","site":"Indeed","company":"Electrical Engineering Services","role":"LabVIEW Developer / Automation Engineer","resume":"full-stack","ats":"Lahore","status":"applied","category":"Full Stack","dup":false},{"channel":"Indeed PK","date":"2026-10-23","site":"Indeed","company":"Rizviz International Impex","role":"Senior Backend & AdTech Integration Engineer","resume":"full-stack","ats":"Lahore","status":"applied","category":"Backend / Node","dup":false},{"channel":"Indeed PK","date":"2026-10-23","site":"Indeed","company":"Clustox","role":"Associate Software Engineer","resume":"full-stack","ats":"Lahore","status":"applied","category":"Full Stack","dup":false},{"channel":"Indeed PK","date":"2026-10-23","site":"Indeed","company":"Autometa Limited","role":"Senior Software Engineer (AI-Native)","resume":"full-stack","ats":"Lahore","status":"applied","category":"AI / LLM","dup":false},{"channel":"Indeed PK","date":"2026-10-23","site":"Indeed","company":"NKU Technologies Pvt.Ltd.","role":"AI Product Engineer – Innovation","resume":"full-stack","ats":"Lahore","status":"applied","category":"AI / LLM","dup":false},{"channel":"Indeed PK","date":"2026-10-23","site":"Indeed","company":"CodeNinja","role":"AI Engineer","resume":"full-stack","ats":"Lahore","status":"applied","category":"AI / LLM","dup":false},{"channel":"Indeed PK","date":"2026-10-23","site":"Indeed","company":"Abacus","role":"AI Engineer","resume":"full-stack","ats":"Lahore","status":"applied","category":"AI / LLM","dup":false},{"channel":"Indeed PK","date":"2026-10-23","site":"Indeed","company":"Gigalabs (Pvt) Ltd.","role":"AI Solution Engineer","resume":"full-stack","ats":"Lahore","status":"applied","category":"AI / LLM","dup":false},{"channel":"Indeed PK","date":"2026-10-23","site":"Indeed","company":"Modulus OS","role":"AI/Agent Engineer — Retrieval & Financial Validators","resume":"full-stack","ats":"Lahore","status":"applied","category":"AI / LLM","dup":false},{"channel":"Websites (Oct)","date":"2026-10-05","site":"Website","company":"Wizdaa","role":"RN","resume":"","ats":"","status":"applied","category":"Other","dup":false},{"channel":"Websites (Oct)","date":"2026-10-05","site":"Website","company":"Pavago","role":"AI Product Engineer, Full Stack","resume":"","ats":"","status":"applied","category":"AI / LLM","dup":false}]};
const CH = [
  {id:"overview", name:"Overview"},
  {id:"Job boards", name:"Websites & job boards", color:"var(--c-boards)", group:"site", group2:"ats", g1:"By site", g2:"By form system"},
  {id:"Email", name:"Email applies", color:"var(--c-email)", group:"company", g1:"By company"},
  {id:"Indeed PK", name:"Indeed", color:"var(--c-indeed)", group:"ats", group2:"resume", g1:"By location", g2:"By resume"},
  {id:"Websites (Oct)", name:"Older website runs", color:"var(--c-web)", group:"company", g1:"By company"},
];
const S = {tab:"overview", range:"7", from:"", to:"", q:"", cat:"", sort:"date", dir:-1};
try{const s=JSON.parse(localStorage.getItem("apptracker")||"{}"); if(s.tab) S.tab=s.tab;}catch(e){}
const $ = s=>document.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso = d=>d.toISOString().slice(0,10);
const today = iso(new Date());
const days = n=>{const d=new Date(); d.setDate(d.getDate()-n+1); return iso(d);};

function bounds(){
  if(S.from||S.to) return [S.from||"0000", S.to||"9999"];
  if(S.range==="all") return ["0000","9999"];
  if(S.range==="today") return [today,today];
  return [days(+S.range), today];
}
function inRange(r){const [a,b]=bounds(); return (r.date||"0000")>=a && (r.date||"0000")<=b && (!S.cat||r.category===S.cat);}
function count(rows,f){const o={}; for(const r of rows){const k=f(r)||"—"; o[k]=(o[k]||0)+1;} return Object.entries(o).sort((a,b)=>b[1]-a[1]);}
function prevCount(rows){ // same-length window before the current one
  const [a,b]=bounds(); if(a==="0000") return null;
  const len=(new Date(b)-new Date(a))/864e5+1; const pb=new Date(a); pb.setDate(pb.getDate()-1); const pa=new Date(pb); pa.setDate(pa.getDate()-len+1);
  return rows.filter(r=>r.date>=iso(pa)&&r.date<=iso(pb)).length;
}

function kpi(label,val,color,sub){return `<div class="kpi" style="--bar:${color||"var(--acc)"}"><div class="l">${esc(label)}</div><div class="v">${val}</div>${sub?`<div class="d">${sub}</div>`:""}</div>`;}
function list(entries,max=10){
  if(!entries.length) return `<div class="empty">Nothing in this range</div>`;
  const top=entries[0][1];
  return `<ul class="list">${entries.slice(0,max).map(([k,v])=>`<li><span class="nm" title="${esc(k)}">${esc(k)}</span><span class="bar"><span style="width:${(v/top*100).toFixed(1)}%"></span></span><span class="ct">${v}</span></li>`).join("")}</ul>`;
}
function chart(rows,series){
  let [a,b]=bounds();
  if(a==="0000"){const ds=rows.map(r=>r.date).filter(Boolean).sort(); a=ds[0]||today; b=today;}
  const dates=[]; for(let d=new Date(a); iso(d)<=b && dates.length<400; d.setDate(d.getDate()+1)) dates.push(iso(d));
  if(dates.length>120){ // weekly buckets
    const wk={}; for(const r of rows){const d=new Date(r.date); d.setDate(d.getDate()-d.getDay()); (wk[iso(d)] ||= []).push(r);}
    return bars(Object.keys(wk).sort(),k=>wk[k],series,"week of ");
  }
  const by={}; for(const r of rows)(by[r.date] ||= []).push(r);
  return bars(dates,k=>by[k]||[],series,"");
}
function bars(keys,get,series,pre){
  const W=1000,H=200,pad=24,bw=Math.max(2,(W-pad)/keys.length-2);
  const totals=keys.map(k=>get(k).length); const max=Math.max(1,...totals);
  let svg=`<svg class="chart" viewBox="0 0 ${W} ${H+22}" preserveAspectRatio="none" role="img" aria-label="Applications per day">`;
  for(let t=0;t<=4;t++){const y=H-(H*t/4); svg+=`<line x1="${pad}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="0" y="${y+4}" font-size="11" fill="var(--mut)">${Math.round(max*t/4)}</text>`;}
  keys.forEach((k,i)=>{
    let y=H; const x=pad+i*((W-pad)/keys.length)+1; const rs=get(k);
    for(const s of series){const n=rs.filter(r=>r.channel===s.id).length; if(!n) continue; const h=n/max*H; y-=h;
      svg+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="2" fill="${s.color}"><title>${pre}${k}: ${n} ${s.name}</title></rect>`;}
  });
  const step=Math.ceil(keys.length/8);
  keys.forEach((k,i)=>{ if(i%step===0) svg+=`<text x="${pad+i*((W-pad)/keys.length)}" y="${H+16}" font-size="11" fill="var(--mut)">${k.slice(5)}</text>`;});
  return svg+"</svg>"+`<div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>`;
}
function table(rows,ch){
  const cols = ch.id==="Email" ? [["date","Date"],["category","Category"],["company","Company"],["role","Role"],["ats","Sent to"],["status","Status"]]
    : ch.id==="Indeed PK" ? [["date","Date"],["category","Category"],["company","Company"],["role","Role"],["ats","Location"],["resume","Resume"]]
    : ch.id==="overview" ? [["date","Date"],["channel","Channel"],["category","Category"],["site","Site"],["company","Company"],["role","Role"]]
    : [["date","Date"],["category","Category"],["site","Site"],["company","Company"],["role","Role"],["ats","Form system"],["status","Status"]];
  const q=S.q.toLowerCase();
  let rs=rows.filter(r=>!q||[r.company,r.role,r.site,r.ats,r.channel,r.category].join(" ").toLowerCase().includes(q));
  rs.sort((a,b)=>String(a[S.sort]??"").localeCompare(String(b[S.sort]??""))*S.dir);
  return `<div class="tools"><input id="q" placeholder="Search company, role, site, email… (check here before applying)" value="${esc(S.q)}"><span class="sub" style="align-self:center">${rs.length} shown</span></div>
  <div class="tbl">${rs.length?`<table><thead><tr>${cols.map(([k,l])=>`<th data-k="${k}">${l}${S.sort===k?(S.dir<0?" ↓":" ↑"):""}</th>`).join("")}</tr></thead><tbody>
  ${rs.slice(0,2000).map(r=>`<tr class="${r.dup?"dup":""}">${cols.map(([k])=>`<td>${k==="status"&&r.dup?`<span class="tag dup">possible duplicate</span> `:""}${(k==="resume"||k==="category")&&r[k]?`<span class="tag">${esc(r[k])}</span>`:esc(r[k])}</td>`).join("")}</tr>`).join("")}</tbody></table>`:`<div class="empty">No applications match this range and search.</div>`}</div>`;
}

function catTable(rows,series){
  const cats=count(rows,r=>r.category); if(!cats.length) return `<div class="empty">Nothing in this range</div>`;
  const top=cats[0][1];
  return `<div class="tbl" style="max-height:none"><table style="min-width:560px"><thead><tr><th>Category</th>${series.map(s=>`<th><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${s.color};margin-right:5px"></i>${esc(s.name)}</th>`).join("")}<th>Total</th><th style="width:30%"></th></tr></thead><tbody>
  ${cats.map(([c,n])=>`<tr><td><b>${esc(c)}</b></td>${series.map(s=>`<td>${rows.filter(r=>r.category===c&&r.channel===s.id).length||"–"}</td>`).join("")}<td><b>${n}</b></td><td><div class="list"><span class="bar" style="display:block;width:100%"><span style="width:${(n/top*100).toFixed(1)}%"></span></span></div></td></tr>`).join("")}</tbody></table></div>`;
}
function render(){
  try{localStorage.setItem("apptracker",JSON.stringify({tab:S.tab}));}catch(e){}
  const all=DATA.rows, rows=all.filter(inRange);
  const cs=$("#cat"); if(cs.options.length<2){[...new Set(all.map(r=>r.category))].sort().forEach(c=>cs.add(new Option(c,c)));} cs.value=S.cat;
  $("#gen").textContent=`Updated ${new Date(DATA.generatedAt).toLocaleString()} · ${all.length} applications all time`;
  document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on",!S.from&&!S.to&&b.dataset.r===S.range));
  $("#tabs").innerHTML=CH.map(c=>`<button data-t="${c.id}" class="${S.tab===c.id?"on":""}">${esc(c.name)}<span class="n">${c.id==="overview"?rows.length:rows.filter(r=>r.channel===c.id).length}</span></button>`).join("");
  const series=CH.slice(1);
  const ch=CH.find(c=>c.id===S.tab)||CH[0];
  let html="";
  if(ch.id==="overview"){
    const prev=prevCount(all);
    html+=`<div class="grid">${kpi("Applied in range",rows.length,"var(--acc)",prev==null?"":`${prev} in the previous period`)}
      ${series.map(s=>kpi(s.name,rows.filter(r=>r.channel===s.id).length,s.color)).join("")}
      ${kpi("Today",all.filter(r=>r.date===today).length,"var(--acc)")}</div>`;
    html+=`<div class="row2"><div class="panel"><h3>Applications per day</h3>${chart(rows,series)}</div>
      <div class="panel"><h3>Top companies</h3>${list(count(rows,r=>r.company),12)}</div></div>`;
    html+=`<div class="panel"><h3>By category</h3>${catTable(rows,series)}</div>`;
    html+=`<div class="panel"><h3>All applications in range</h3>${table(rows,ch)}</div>`;
  } else {
    const rs=rows.filter(r=>r.channel===ch.id), allc=all.filter(r=>r.channel===ch.id);
    html+=`<div class="grid">${kpi("In range",rs.length,ch.color)}${kpi("Today",allc.filter(r=>r.date===today).length,ch.color)}${kpi("All time",allc.length,ch.color)}${kpi("Possible duplicates",rs.filter(r=>r.dup).length,"var(--warn)")}</div>`;
    html+=`<div class="row2"><div class="panel"><h3>Per day</h3>${chart(rs,[ch])}</div><div class="panel"><h3>By category</h3>${list(count(rs,r=>r.category),8)}<h3 style="margin-top:14px">${ch.g1}</h3>${list(count(rs,r=>r[ch.group]),10)}${ch.group2?`<h3 style="margin-top:14px">${ch.g2}</h3>${list(count(rs,r=>r[ch.group2]),8)}`:""}</div></div>`;
    html+=`<div class="panel"><h3>${esc(ch.name)}</h3>${table(rs,ch)}</div>`;
  }
  $("#view").innerHTML=html;
  const q=$("#q"); if(q){q.oninput=e=>{S.q=e.target.value; const pos=e.target.selectionStart; render(); const n=$("#q"); n.focus(); n.setSelectionRange(pos,pos);};}
  document.querySelectorAll("th[data-k]").forEach(th=>th.onclick=()=>{const k=th.dataset.k; S.dir=S.sort===k?-S.dir:(k==="date"?-1:1); S.sort=k; render();});
}
$("#seg").onclick=e=>{const b=e.target.closest("button"); if(!b) return; S.range=b.dataset.r; S.from=S.to=""; $("#from").value=$("#to").value=""; render();};
$("#cat").onchange=e=>{S.cat=e.target.value; render();};
$("#from").onchange=e=>{S.from=e.target.value; render();};
$("#to").onchange=e=>{S.to=e.target.value; render();};
$("#tabs").onclick=e=>{const b=e.target.closest("button"); if(!b) return; S.tab=b.dataset.t; S.q=""; render();};
render();
setTimeout(()=>location.reload(),120000);
</script>
